name: Weather CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tools
        run: |
          echo "Hello from self-hosted runner!"
          docker --version
          kubectl version --client
          helm version

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}" .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}"
          docker tag "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}" "${{ secrets.DOCKERHUB_USERNAME }}/weather:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/weather:latest"

      - name: Deploy to Minikube
        run: |
          # Ensure Minikube is running
          minikube status || minikube start
          
          # Point Docker to Minikube's Docker daemon to use local images
          eval $(minikube docker-env)
          
          # Build the image in Minikube
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}" .
          
          # Update Helm values with the new image tag
          cat > /tmp/minikube-values.yaml <<EOF
          image:
            repository: ${{ secrets.DOCKERHUB_USERNAME }}/weather
            tag: "${{ github.sha }}"
            pullPolicy: Never
          EOF
          
          # Deploy to Minikube using Helm
          helm upgrade --install weather ./weather-chart \
            -f weather-chart/values.yaml \
            -f /tmp/minikube-values.yaml \
            --namespace default \
            --create-namespace
          
          # Wait for deployment to be ready
          kubectl rollout status deployment/weather-deployment -n default --timeout=2m
          
          # Verify the deployment
          echo "Deployment status:"
          kubectl get pods -n default -l app=weather-chart
          echo "Service status:"
          kubectl get svc -n default
