name: Weather CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tools
        run: |
          echo "Hello from self-hosted runner!"
          docker --version
          kubectl version --client
          helm version

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}" .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}"
          docker tag "${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ github.sha }}" "${{ secrets.DOCKERHUB_USERNAME }}/weather:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/weather:latest"
