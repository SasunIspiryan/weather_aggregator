# Ansible Configuration for Docker Container Management
# This configuration optimizes Ansible to work with Docker containers

[defaults]
# Inventory file path
inventory = ./inventory.yml

# Connection method default (can be overridden per host)
connection = docker

# Use /tmp for temporary files instead of home directory
# This avoids permission issues in containers
remote_tmp = /tmp/.ansible
local_tmp = /tmp/.ansible

# Disable host key checking for containers (they don't have stable keys)
host_key_checking = False

# Increase timeout for Docker connections
timeout = 30

# Set the number of parallel processes
forks = 5

# Enable additional verbosity for better debugging
#verbosity = 1

# Plugin paths
library = ./plugins/modules
filter_plugins = ./plugins/filters

[docker_connection]
# Docker-specific connection settings
transport = docker
