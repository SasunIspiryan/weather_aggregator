<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Aggregator</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> Weather Aggregator</h1>
            <p>Real-time weather data for Armenian cities</p>
            <div class="controls">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search cities...">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                </div>
                <button id="refresh-btn" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </header>
        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading weather data...
        </div>
        <div id="error" class="error" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="error-message">Failed to load weather data</span>
        </div>
        <div id="weather-container"></div>
    </div>
    <script src="/static/script.js?v=2"></script>
</body>
</html>
