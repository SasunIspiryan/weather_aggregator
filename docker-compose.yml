# Docker Compose configuration for Weather Aggregator application
# This file defines a three-service stack: PostgreSQL database, Flask API, and Nginx reverse proxy

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather_app:
    build: .
    container_name: python_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - shared_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend_app
    restart: unless-stopped
    networks:
      - shared_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - shared_network
    depends_on:
      - weather_app
      - frontend

volumes:
  postgres_data:

networks:
  shared_network:
    driver: bridge

    