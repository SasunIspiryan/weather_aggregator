apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: weather
    app.kubernetes.io/part-of: weather-aggregator
data:
  weather-dashboard.json: |
    {
      "title": "Weather Service Overview",
      "uid": "weather-service-overview",
      "tags": ["weather", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (code) (rate(http_requests_total{namespace=~\".*\"}[5m]))",
              "legendFormat": "{{code}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "type": "timeseries",
          "title": "CPU usage",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"weather.*\"}[5m]))",
              "legendFormat": "CPU"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "cores"}}
        },
        {
          "type": "timeseries",
          "title": "Memory usage",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod=~\"weather.*\"})",
              "legendFormat": "Memory"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        }
      ]
    }
