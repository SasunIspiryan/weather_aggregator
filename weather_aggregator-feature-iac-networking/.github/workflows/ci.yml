name: Weather CI
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: self-hosted
    env:
      IMAGE_NAME: weather
    steps:
      - uses: actions/checkout@v4

      - name: Verify tools
        run: |
          echo "Hello from self-hosted runner!"
          docker --version
          kubectl version --client || true
          helm version --client || true

      - name: Log in to Amazon ECR
        if: ${{ secrets.ECR_REGISTRY != '' }}
        uses: aws-actions/amazon-ecr-login@v1
        with:
          region: ${{ secrets.AWS_REGION }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .
          if [ -n "${{ secrets.ECR_REGISTRY }}" ]; then \
            docker tag $IMAGE_NAME:latest ${{ secrets.ECR_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest; \
          fi

      - name: Push to ECR
        if: ${{ secrets.ECR_REGISTRY != '' }}
        run: |
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest

      - name: Skip push (no registry configured)
        if: ${{ secrets.ECR_REGISTRY == '' }}
        run: echo "No ECR_REGISTRY secret set; skipping push. Configure secrets to enable push."
