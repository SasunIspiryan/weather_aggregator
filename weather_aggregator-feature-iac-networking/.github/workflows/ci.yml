name: Weather CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # STAGE 1: TEST
  # ============================================
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q tests/ || pytest -q

  # ============================================
  # STAGE 2: BUILD
  # ============================================
  build:
    needs: test
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ steps.meta.outputs.tag }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ steps.meta.outputs.tag }}

      - name: Tag as latest on main branch
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/weather:${{ steps.meta.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/weather:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather:latest

  # ============================================
  # STAGE 3: DEPLOY
  # ============================================
  deploy:
    needs: build
    runs-on: self-hosted
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Minikube with Helm
        run: |
          helm upgrade --install weather ./weather-chart \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/weather \
            --set image.tag=${{ needs.build.outputs.tag }}
          kubectl rollout status deployment/weather-deployment -n default --timeout=5m
