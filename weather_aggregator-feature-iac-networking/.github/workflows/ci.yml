name: Weather CI

on:
  push:
    branches: [main]

jobs:
  hello-runner:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Verify self-hosted runner tools
        run: |
          echo "Hello from self-hosted runner!"
          docker --version
          kubectl version --client --short
          helm version --short

      - name: Build Docker image
        run: |
          docker build -t weather-backend:ci .

      - name: Configure AWS credentials for ECR push
        if: ${{ secrets.ECR_REGISTRY != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.ECR_REGION }}

      - name: Login to ECR
        if: ${{ secrets.ECR_REGISTRY != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          aws ecr get-login-password --region ${{ secrets.ECR_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Tag and push image to ECR
        if: ${{ secrets.ECR_REGISTRY != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          docker tag weather-backend:ci ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
