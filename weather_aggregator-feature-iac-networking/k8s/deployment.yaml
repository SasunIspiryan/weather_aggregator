apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-deployment
  namespace: weather
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: weather
  template:
    metadata:
      labels:
        app: weather
    spec:
      containers:
        - name: weather
          image: weather-backend:hw26
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: weather-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weather-db-creds
                  key: DB_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: weather-db-creds
                  key: DB_USER
          volumeMounts:
            - name: weather-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: weather-storage
          persistentVolumeClaim:
            claimName: weather-data-pvc